- date: 07/31/26
  title: "Business North Carolina: quantum computing in the state's tech scene"
  tags:
    - media
  content: >
      Business North Carolina's NC Trend feature discusses how a growing cluster of
      quantum R&D in the Triangle could become a core part of the state's tech scene,
      quoting Prof. Kais on North Carolina's opportunity to help lead the quantum
      revolution and highlighting NC State's IBM Quantum access, faculty strength,
      and the Goodnight Distinguished Chair.
      https://businessnc.com/nc-trend-quantum-computing-could-become-a-core-part-of-the-states-tech-scene/

- date: 06/24/26
  title: "College of Engineering: What to Know from NC State's Quantum Workshop"
  tags:
    - media
    - workshop
  content: >
      NC State College of Engineering covers the first Summer Workshop on Quantum
      Machine Learning for Complex Science and Engineering Problems (June 1–5),
      which brought 150 researchers and industry professionals to campus. Prof. Kais,
      chair of the organizing committee, shares takeaways on moving quantum machine
      learning from theory to real-world applications.
      https://engr.ncsu.edu/news/2026/06/24/what-to-know-from-nc-states-quantum-workshop/

- date: 06/16/26
  title: "Dr. Hrushikesh Patil joins the group"
  tags:
    - new member
  content: >
      Dr. Hrushikesh Patil joins the group as a Postdoctoral Researcher. Dr Patil finished his Ph.D. in Computer Engineering at NC State University in quantum error correction and mitigation and will be working on quantum computing in the group. Welcome to the group, Dr. Patil!
      
- date: 06/15/26
  title: "Dr. Ammar Ali joins the group"
  tags:
    - new member
  content: >
      Dr. Ammar Ali joins the group as a Postdoctoral Researcher. Dr Ali finished his Ph.D. in Physics at Purdue University and will be working on quantum computing in the group. Welcome to the group, Dr. Ali!


